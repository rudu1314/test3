<header class="site-header">
  <button
    class="menu-toggle"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="main-navigation"
    aria-label="切換導覽選單"
  >
    <span class="menu-toggle-label">開啟選單</span>
    <span class="menu-icon" [class.is-open]="menuOpen" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>

  @if (menuOpen) {
    <nav id="main-navigation" class="top-nav" aria-label="主導覽">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <span>主頁面</span>
      </a>
      <a
        class="nav-link"
        routerLink="/comp2"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <span>BMI 頁面</span>
      </a>
      <button
        class="nav-link nav-button"
        type="button"
        (click)="checkUser(); closeMenu()"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <span>練習頁面</span>
      </button>
      <a
        class="nav-link"
        routerLink="/input1"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <span>輸入練習</span>
      </a>
      <a
        class="nav-link"
        routerLink="/apitest"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <span>天氣 API</span>
      </a>
      <a
        class="nav-link"
        routerLink="/apitest2"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <span>專業氣象</span>
      </a>
    </nav>
  }
</header>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
